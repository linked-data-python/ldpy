[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linked-data-python"
version = "0.5.0"
description = "Python extended with Semantic Web primitives: IRIs, RDF literals and Turtle-notation graphs as expressions, transpiled by island parsing."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maxime Lefrançois", email = "maxime.lefrancois@emse.fr" }]
requires-python = ">=3.10"
keywords = ["rdf", "semantic-web", "turtle", "sparql", "transpiler",
            "linked-data", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Pre-processors",
    "Topic :: Text Processing :: Markup",
]
dependencies = ["rdflib>=6.0"]

[project.optional-dependencies]
# délégation du language server à un vrai serveur Python (request forwarding)
lsp = ["python-lsp-server", "pyflakes"]
# débogage des fichiers fantômes
debug = ["debugpy"]
dev = ["pytest"]
# coloration syntaxique : lexer Pygments (fiche 023) — OPTIONNEL, rien dans
# ldpy ne l'importe, Pygments le charge par entry point s'il est installé
highlight = ["pygments>=2.14"]
# formateur (fiche 024) — OPTIONNEL de la même façon : seul ldpy/formatter.py
# importe black, et seulement à l'appel
format = ["black>=24"]
docs = ["mkdocs", "mkdocs-material", "pygments>=2.14"]

[project.scripts]
ldpy = "ldpy.__main__:main"
ldpy-lsp = "ldpy.lsp.server:main"
ldpy-build = "ldpy.build:main"
ldpy-debug = "ldpy.debug:main"
ldpy-format = "ldpy.formatter:main"

# le surligneur est le transpileur : le lexer lit la language map (fiche 023).
# Enregistré comme plugin Pygments, il sert mkdocs, Sphinx et `pygmentize`.
[project.entry-points."pygments.lexers"]
ldpy = "ldpy.pygments_lexer:LdpyLexer"

[project.urls]
Homepage = "https://github.com/linked-data-python/ldpy"
Documentation = "https://linked-data-python.readthedocs.io/"
Source = "https://github.com/linked-data-python/ldpy"

[tool.setuptools.packages.find]
include = ["ldpy*"]

[tool.pytest.ini_options]
markers = ["slow: tests lents (benchmarks, corpus)"]
testpaths = ["tests"]
