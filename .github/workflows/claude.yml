# Claude Code, on demand.
#
# Trigger: the literal string `@claude` in an issue, an issue comment, a pull
# request review, or a review comment. Claude then reads the thread, works in
# a checkout of the repository, and answers in place.
#
# Secret to set in the repository (Settings -> Secrets and variables ->
# Actions):
#
#   CLAUDE_CODE_OAUTH_TOKEN   produced by `claude setup-token` on a machine
#                             logged into the Claude subscription. It is
#                             long-lived but not eternal: when the workflow
#                             starts failing on authentication, run the
#                             command again and replace the secret.
#
# The GitHub App must also be installed on this repository, otherwise the
# workflow has no identity to comment with:
#
#     https://github.com/apps/claude/installations/new
#
# Runs are billed against the subscription quota, so every `@claude` on a
# public repository costs something. The `if:` guard below is what keeps
# ordinary comments from starting a run.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Reading its own CI results is what lets Claude answer "why is the
          # build red" instead of guessing.
          claude_args: '--allowed-tools "Bash(gh run view:*),Bash(gh run list:*)"'
